<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Deadline | {{ course.name }}</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles-dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles-theme.css') }}">
</head>
<body class="p-5">

{% include "template-theme.html" %}

<div class="container">
  <h3 class="mb-4">Add Deadline for {{ course.name }}</h3>

  <form method="POST">
    {{ get_flashed_messages() }}
    <div class="mb-3">
      <label for="assignment" class="form-label">Assignment</label>
      <input type="text" class="form-control" name="assignment" id="assignment" required>
    </div>
    <div class="mb-3">
      <label for="due-date" class="form-label">Due Date & Time</label>
      <input type="datetime-local" class="form-control" name="due-date" id="due-date" required>
    </div>
    <button type="submit" class="btn btn-primary">Add Deadline</button>
  </form>
</div>

</body>
</html>
