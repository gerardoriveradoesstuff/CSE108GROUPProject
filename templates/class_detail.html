<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.name }} | ACME University</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h2>ACME University</h2> 
    <a href="{{ url_for('main.logout') }}">Sign out</a>

    <a href="{{ url_for('main.teacher_dashboard') }}" class="back-button">
        ⬅️
    </a>

    <form method="POST">
        <h3>Course: {{ course.name }}</h3>

        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.username }}</td>
                    <td>
                        <input type="number" name="grade_{{ student.id }}"
                               value="{{ grades.get(student.id).grade if grades.get(student.id) else '' }}"
                               min="0" max="100" required>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <input type="submit" value="Save Grades">
    </form>
</body>
</html>
