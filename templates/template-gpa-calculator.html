<div class="card mt-4 shadow-sm">
    <div class="card-header">
        GPA Calculator
    </div>
    <div class="card-body">
        <form id="gpa-form" class="row g-3">
            <div class="col-12">
                <label for="course-name" class="form-label">Course Name</label>
                <input type="text" id="course-name" class="form-control" placeholder="e.g., Math 101" required>
            </div>
            <div class="col-12">
                <label for="grade" class="form-label">Grade</label>
                <select id="grade" class="form-select" required>
                    <option value="" disabled selected>Select Grade</option>
                    <option value="4">A</option>
                    <option value="3.7">A-</option>
                    <option value="3.3">B+</option>
                    <option value="3">B</option>
                    <option value="2.7">B-</option>
                    <option value="2.3">C+</option>
                    <option value="2">C</option>
                    <option value="1">D</option>
                    <option value="0">F</option>
                </select>
            </div>
            <div class="col-12">
                <label for="credits" class="form-label">Credit Hours</label>
                <input type="number" id="credits" class="form-control" step="1" min="1" max="5" required>
            </div>
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary">Add Course</button>
            </div>
        </form>


        <hr>
        <h5>Course Entries</h5>
        <ul id="course-list" class="list-group mb-3"></ul>

        <div class="text-center">
            <h4>Your GPA: <span id="gpa-result">0.00</span></h4>
        </div>
        <div class="text-center mt-3">
            <button class="btn btn-warning me-2" onclick="clearAllCourses()">Clear All</button>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='gpa-calculator.js') }}"></script>
