<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard | UCM University</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Dashboard Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-dashboard.css') }}">
    <!-- Theme Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-theme.css') }}">

</head>
<body>
{% include "template-theme.html" %}

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        {% include "template-sidebar.html" %}

        <!-- Main Content Area -->
        <main class="col-md-10 ml-sm-auto col-lg-10 px-4 pt-3">

            <!-- PROFILE BANNER -->
            <form method="POST" action="{{ url_for('main.profile') }}">
                <div class="pt-4">
                    <h1 class="h3 mb-3">Student Profile</h1>

                    <div class="card shadow-sm mb-4">
                        <div class="card-body d-flex align-items-start">
                            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/ea/McGonagall_%28screenshot%29.jpg/250px-McGonagall_%28screenshot%29.jpg"
                                 class="rounded me-4" width="120" height="120" alt="Profile Picture">

                            <div class="flex-grow-1">
                                <h4 class="mb-1">{{ user.username.capitalize() }}</h4>
                                <p class="mb-1">📧 Email: {{ user.email }}</p>
                                <div class="mb-2">
                                    <label class="form-label">🎓 Major</label>
                                    <input type="text" name="major" class="form-control form-control-sm"
                                           value="{{ user.major or '' }}">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label">📅 Expected Graduation Year</label>
                                    <input type="text" name="year" class="form-control form-control-sm"
                                           value="{{ user.year or '' }}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Biography -->
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">Biography</div>
                                <div class="card-body">
                                    <textarea name="bio" class="form-control" rows="4">{{ user.bio }}</textarea>
                                    <small class="form-text text-muted">Describe yourself.</small>
                                </div>
                            </div>
                        </div>

                        <!-- LinkedIn -->
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">Linked Accounts</div>
                                <div class="card-body">
                                    <input type="url" class="form-control" name="linkedin_url"
                                           placeholder="LinkedIn URL"
                                           value="{{ user.linkedin_url or '' }}">
                                    <small class="form-text text-muted">Provide your LinkedIn profile URL.</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Name Pronunciation -->
                    <div class="card mb-4">
                        <div class="card-header">Name Pronunciation</div>
                        <div class="card-body">
                            <input type="text" class="form-control" name="pronunciation" placeholder="Pronunciation"
                                   value="{{ user.pronunciation or '' }}">
                        </div>
                    </div>

                    <div class="text-end mb-4">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
