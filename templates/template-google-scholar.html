<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Scholar Feed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script defer src="google_scholar_feed.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">📚 Google Scholar Search</h2>

        <form id="scholar-form" class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="query" class="form-label">Search Query</label>
                <input type="text" class="form-control" id="query" placeholder="e.g. neural networks in education" required>
            </div>
            <div class="col-md-3">
                <label for="from-year" class="form-label">From Year</label>
                <input type="number" class="form-control" id="from-year" placeholder="e.g. 2020">
            </div>
            <div class="col-md-3">
                <label for="to-year" class="form-label">To Year</label>
                <input type="number" class="form-control" id="to-year" placeholder="e.g. 2024">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-newspaper"></i> Search Results
            </div>
            <div class="card-body" id="news-feed">
                <p>Enter a query to see scholarly articles.</p>
            </div>
        </div>
    </div>
</body>
</html>
