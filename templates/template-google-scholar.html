<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <i class="bi bi-journal-text"></i> Google Scholar Search
        <i class="bi text-right"></i>(100 available queries)
    </div>
    <div class="card-body">
        <form id="scholar-form" class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="query" class="form-label">Search Query</label>
                <input type="text" class="form-control" id="query" placeholder="e.g. neural networks in education" required>
            </div>
            <div class="col-md-3">
                <label for="from-year" class="form-label">From Year</label>
                <input type="number" class="form-control" id="from-year" placeholder="e.g. 2020">
            </div>
            <div class="col-md-3">
                <label for="to-year" class="form-label">To Year</label>
                <input type="number" class="form-control" id="to-year" placeholder="e.g. 2025">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <div class="p-3" id="google-scholar">
            <p class="text-muted">Enter a query to see scholarly articles.</p>
        </div>
    </div>
</div>

<!-- Only load the script once -->
<script defer src="{{ url_for('static', filename='google-scholar-feed.js') }}"></script>
