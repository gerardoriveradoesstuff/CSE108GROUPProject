<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard | UCM University</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Dashboard Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-dashboard.css') }}">
    <!-- Theme Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-theme.css') }}">

</head>
<body>
{% include "template-theme.html" %}

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        {% include "template-sidebar.html" %}

        <!-- Main Content Area -->
        <main class="col-md-10 ml-sm-auto col-lg-10 px-4 pt-3">

            <!-- PROFILE BANNER -->
            <h2 class="h3 mb-3">Welcome {{ user.username.capitalize() }}</h2>
            <div class="card mb-4 shadow-sm">
                <div class="card-body d-flex align-items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/ea/McGonagall_%28screenshot%29.jpg/250px-McGonagall_%28screenshot%29.jpg"
                         alt="Profile Picture" class="rounded-circle me-3"
                         width="64" height="64">
                    <div method="GET" action="{{ url_for('main.profile') }}">
                        <p class="mb-1">🎓 Major: {{ current_user.major or 'None' }}</p>
                        <p class="mb-1">📅 Expected Graduation Year: {{ current_user.year or 'None' }}</p>

                    </div>
                    GPA: {{ user.GPA }} <br>
<!--                    &lt;!&ndash; Optional: Add a link to Profile &ndash;&gt;-->
<!--                    <div class="ms-auto">-->
<!--                        <a href="#" class="btn btn-sm btn-outline-secondary">Edit Profile</a>-->
<!--                    </div>-->
                </div>
            </div>
            <!-- GOOGLE SCHOLAR -->
            <div class="row">
                <div class="col-md-6 mb-4">

                {% include "template-google-scholar.html" %}
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
