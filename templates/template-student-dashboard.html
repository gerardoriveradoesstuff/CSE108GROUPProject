<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard | UCM University</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Dashboard Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-dashboard.css') }}">
    <!-- Theme Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-theme.css') }}">

</head>
<body>
{% include "template-theme.html" %}

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        {% include "template-sidebar.html" %}

        <!-- Main Content Area -->
        <main class="col-md-10 ml-sm-auto col-lg-10 px-4 pt-3">

            <!-- PROFILE BANNER -->
            <h2 class="h3 mb-3">Welcome {{ user.username.capitalize() }}</h2>
            <div class="card mb-4 shadow-sm">
                {% include "template-profile-banner.html" %}
            </div>
            <!-- GOOGLE SCHOLAR -->
            <div class="row">
                <div class="col-md-6 mb-4">

                {% include "template-google-scholar.html" %}
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
