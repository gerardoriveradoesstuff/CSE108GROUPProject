<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forum | UCM University</title>
   <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Dashboard Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-dashboard.css') }}">
    <!-- Theme Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-theme.css') }}">
</head>

<body>
{% include "template-theme.html" %}

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Course Discussions</h2>
            <a href="{{ url_for('teacher.create_post') }}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> New Post
            </a>
        </div>

        <div class="list-group">
            {% for post in posts %}
            <div class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">{{ post.title }}</h5>
                    <small>
                        Posted by: {{ post.user.username if post.user else 'Unknown' }}
                    </small>
                </div>
                <p class="mb-1">{{ post.content }}</p>
                {% if post.course %}
                <small>Course: {{ post.course.name }}</small>
                {% endif %}
            </div>
            {% else %}
            <div class="alert alert-info">No discussions yet.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
